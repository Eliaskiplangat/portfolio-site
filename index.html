<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elias Kiplangat — Backend Developer</title>
<meta name="description" content="Elias Kiplangat, backend developer working in Java (Spring Boot), Elixir, and Docker. Based in Nairobi." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body, #root { width: 100%; overflow-x: hidden; }
  img, svg, video, canvas { max-width: 100%; }
  /* Recruiter-focused editorial theme: restrained color, clear hierarchy, no gradients. */
  body {
    --bg: #f2f6fa;
    --surface: #ffffff;
    --surface-2: #e8eff6;
    --line: #cbd9e7;
    --text: #14283e;
    --text-dim: #60758a;
    --blue: #1f5f91;
    --blue-dark: #153f67;
    --blue-deep: #0d2b48;
    --amber: #d9a24e;
    --violet: #1f5f91;
    --mint: #2f72a3;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 4px; }
  .pf-display { font-family: 'Space Grotesk', sans-serif; }
  .pf-mono { font-family: 'JetBrains Mono', monospace; }
  .pf-container { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  .pf-nav { background: rgba(242,246,250,0.96); border-bottom: 1px solid var(--line); }
  .pf-nav-inner { max-width: 820px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .pf-logo { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .pf-logo span { color: var(--amber); }
  .pf-nav-links { display: flex; gap: 22px; }
  .pf-nav-links a { color: var(--text-dim); }
  .pf-nav-links a:hover { color: var(--blue); }
  .pf-nav-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; }
  .pf-mobile-menu { display: none; flex-direction: column; padding: 8px 24px 20px; gap: 14px; border-bottom: 1px solid var(--line); }
  .pf-mobile-menu a { font-size: 0.98rem; color: var(--text-dim); }
  @media (max-width: 640px) {
    .pf-nav-links { display: none; }
    .pf-nav-toggle { display: block; }
    .pf-mobile-menu.open { display: flex; }
  }

  .pf-hero, .pf-section { max-width: 820px; }
  .pf-hero { position: relative; background: var(--blue-dark); border-radius: 10px; color: #ffffff; margin-top: 28px; margin-bottom: 32px; padding-left: 56px; padding-right: 56px; box-shadow: 0 18px 40px rgba(13,43,72,0.16); }
  .pf-hero::before { content: ""; position: absolute; left: 0; top: 28px; bottom: 28px; width: 5px; background: var(--amber); border-radius: 0 4px 4px 0; }
  .pf-eyebrow { color: #dbeafb; text-transform: uppercase; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
  .pf-dot { background: var(--amber); box-shadow: none; width: 7px; height: 7px; }
  .pf-hero h1 { max-width: 690px; letter-spacing: -0.035em; }
  .pf-terminal, .pf-crates { display: none; }
  .pf-hero-sub { max-width: 610px; color: #dbe6f2; font-size: 1.08rem; line-height: 1.75; }
  .pf-btn { border-radius: 6px; min-height: 44px; transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease; }
  .pf-btn:hover { transform: none; }
  .pf-btn-primary { background: var(--amber); color: #16263a; border-color: var(--amber); }
  .pf-btn-primary:hover { background: #edb85e; border-color: #edb85e; }
  .pf-btn-ghost { background: rgba(255,255,255,0.08); color: #ffffff; border-color: rgba(255,255,255,0.32); }
  .pf-btn-ghost:hover { background: rgba(255,255,255,0.14); border-color: #ffffff; }

  .pf-section { border-top: 1px solid var(--line); }
  .pf-section-title { color: var(--blue-deep); }
  .pf-section-title::after { content: ""; display: block; width: 42px; height: 3px; margin-top: 10px; background: var(--amber); border-radius: 2px; }
  .pf-about p, .pf-lead { color: var(--text-dim); }

  .pf-timeline::before { background: var(--line); }
  .pf-tl-item::before { background: var(--surface); border-color: var(--blue); }
  .pf-tl-item:nth-child(even)::before { border-color: var(--amber); }

  .pf-project-card { border-color: var(--line); box-shadow: 0 14px 34px rgba(13,43,72,0.08); }
  .pf-project-bar { background: var(--blue-deep); }
  .pf-project-bar .pf-mono { color: #dbeafb; }
  .pf-project-bar span { display: block; background: rgba(255,255,255,0.28); }
  .pf-project-bar span:first-child { background: var(--amber); }
  .pf-tag { color: var(--blue-deep); background: var(--surface-2); border-color: var(--line); }

  .pf-repo-card { background: var(--surface); }
  .pf-repo-card:hover { border-color: var(--blue); }
  .pf-repo-desc { color: var(--text-dim); }
  .pf-skill-tag { background: var(--surface-2); border-color: var(--line); color: var(--text); }
  .pf-skill-tag:hover { border-color: var(--blue); }
  .pf-contact-link { background: var(--surface); }
  .pf-contact-link:hover { border-color: var(--blue); }
  .pf-footer { border-top: 1px solid var(--line); margin: 0 auto; max-width: 820px; }

  .pf-resume-upload { position: relative; }
  .pf-resume-upload input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pf-resume-status { width: 100%; min-height: 1.25rem; margin: 10px 0 0; font-size: 0.82rem; color: var(--text-dim); }
  .pf-resume-status[data-state="success"] { color: #2f6d56; }
  .pf-resume-status[data-state="error"] { color: #9a3d3d; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .pf-cursor { animation: none; }
    .pf-btn:hover, .pf-skill-tag:hover, .pf-contact-link:hover, .pf-repo-card:hover { transform: none; }
  }
  @media (max-width: 600px) {
    .pf-nav-inner { padding: 14px 16px; }
    .pf-mobile-menu { padding-inline: 16px; }
    .pf-hero { padding: 64px 16px 48px; }
    .pf-section { padding: 44px 16px; }
    .pf-container { padding-inline: 16px; }
    .pf-hero h1 { font-size: clamp(2.15rem, 12vw, 3.1rem); }
    .pf-terminal { padding: 16px; }
    .pf-hero-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
    .pf-hero-actions .pf-btn, .pf-resume-upload { width: 100%; }
    .pf-hero-actions .pf-btn { justify-content: center; }
    .pf-crates { flex-direction: column; }
    .pf-crate { transform: none !important; }
  }
  @media (max-width: 380px) {
    .pf-hero-actions { flex-direction: column; }
    .pf-hero-actions .pf-btn { width: 100%; }
    .pf-project-body { padding: 18px 16px; }
  }
</style>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="root"></div>
<script src="/app.js" defer></script>
</body>
</html>
